<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f80ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <linearGradient id="mf-flap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80b0ff" />
      <stop offset="100%" stop-color="#a374ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#1b1d24" />
  <g filter="url(#shadow)">
    <!-- Main envelope body -->
    <rect x="96" y="144" width="320" height="224" rx="28" fill="url(#mf-grad)" />
    <!-- Dynamic flow fold inner -->
    <path d="M 96 172 L 240 276 C 249.6 283 262.4 283 272 276 L 416 172 L 416 144 L 96 144 Z" fill="url(#mf-flap)" opacity="0.9" />
    <!-- Accent speed flow lines -->
    <path d="M 128 340 L 220 250" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <path d="M 384 340 L 292 250" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <!-- Sparkle accent for AI capability -->
    <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z" fill="#67e8f9" />
  </g>
</svg>
